name: hyperion
version: '0.2.0.0'
author: David Simmons-Duffin
maintainer: davidsd@gmail.com
license: MIT
language: GHC2021

ghc-options: -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints -O2 -Wunused-packages

flags:
  use-external-hostname:
    default: false
    manual: true

library:
  source-dirs: src
  when:
    - condition: (flag(use-external-hostname))
      cpp-options: -DUSE_EXTERNAL_HOSTNAME
  dependencies:
    - aeson
    - async
    - attoparsec
    - base
    - base64
    - binary
    - binaryhash
    - bytestring
    - bytestring-conversion
    - concurrent-output
    - constraints
    - containers
    - directory
    - distributed-process
    - distributed-process-async
    - distributed-static
    - exceptions
    - extra
    - file-io
    - filepath
    - hyperion-static
    - lens
    - mime-mail
    - mtl
    - network
    - network-bsd
    - network-info
    - network-transport
    - network-transport-tcp
    - optparse-applicative
    - os-string
    - pretty
    - pretty-show
    - process
    - random
    - rank1dynamic
    - resource-pool
    - rusage
    - servant-server
    - shell-escape
    - sqlite-simple
    - stm
    - text
    - text-conversions
    - time
    - transformers
    - transformers-base
    - unix
    - vector
    - wai
    - warp

executables:
  example-hello-world:
    source-dirs: example/src-hello-world
    main: Main.hs
    dependencies:
      - base
      - hyperion
      - optparse-applicative
      - text
    ghc-options : -threaded

  example-lock-map:
    source-dirs: example/src-lock-map
    main: Main.hs
    dependencies:
      - base
      - distributed-process
      - hyperion
      - mtl
      - optparse-applicative
      - text
    ghc-options : -threaded

  example-polymorphic-remote:
    source-dirs: example/src-polymorphic-remote
    main: Main.hs
    dependencies:
      - base
      - binary
      - containers
      - hyperion
      - hyperion-static
      - text
    ghc-options : -threaded

  example-root-search:
    source-dirs: example/src-root-search
    main: Main.hs
    dependencies:
      - base
      - hyperion
      - mtl
      - optparse-applicative
    ghc-options : -threaded
